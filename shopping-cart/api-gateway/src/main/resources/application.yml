server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/profiles/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/products/**
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/cart/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/orders/**

jwt:
  secret: ${JWT_SECRET:changeThisSecretItMustBeAtLeast32BytesLongForHS256}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
