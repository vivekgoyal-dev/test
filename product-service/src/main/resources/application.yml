server:
  port: 9082
spring:
  application:
    name: product-service
  datasource:
    url: jdbc:h2:file:./data/productdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
